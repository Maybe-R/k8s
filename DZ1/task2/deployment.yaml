apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-init-deployment
  labels:
    app: nginx-init
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-init
  template:
    metadata:
      labels:
        app: nginx-init
    spec:
      initContainers:
        - name: wait-for-service
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for service nginx-init-service..."
              until nslookup nginx-init-service.homework.svc.cluster.local >/dev/null 2>&1; do
                echo "Service not found. Waiting..."
                sleep 2
              done
              echo "Service nginx-init-service is available."

      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - name: http
              containerPort: 80
